# ============================================================
# Docker Compose for Spotify AI Customer Support Agent
# ============================================================
# The application connects to Neon cloud PostgreSQL (no local DB).
# Provide your API keys via .env file or environment variables.
# ============================================================

services:
  support-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotify-support-agent
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
